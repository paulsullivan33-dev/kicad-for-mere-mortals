site_name: KiCad for Mere Mortals
site_description: Plain-language printed circuit board design with KiCad. Drawing a schematic that says what you mean, laying out the board it describes, checking both with ERC and DRC, keeping symbols and footprints straight, and exporting the Gerber and drill files a fabrication house needs to turn the design into a board you can hold.
site_url: https://paulsullivan33-dev.github.io/kicad-for-mere-mortals/

